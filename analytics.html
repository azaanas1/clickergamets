<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Analytics - ClickerGameTS</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://w3.org viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🚀</text></svg>">
</head>
<body>

    <div class="app-container">
        
        <!-- Sidebar Navigation Layout -->
        <nav class="sidebar-menu">
            <div class="menu-logo" style="font-size: 0.95rem; font-family: monospace; color: deepskyblue; letter-spacing: -0.5px;">
                 clickergamets.pages.dev
            </div>
            <ul class="menu-links">
                <li><a href="index.html">Dashboard</a></li>
                <li class="active-link"><a href="analytics.html">Analytics</a></li>
                <li><a href="settings.html">Settings</a></li>
            </ul>
        </nav>

        <!-- Main Content View Wrapper -->
        <main class="main-content">
            <div class="analytics-grid" style="display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px; width: 100%; max-width: 800px;">
                
                <!-- Card 1: Dynamic High Score Tracker -->
                <div class="dashboard-card" style="max-width: 100%; text-align: left;">
                    <h3 style="color: #64748b; font-size: 0.85rem; text-transform: uppercase; letter-spacing: 0.5px;">Total Session Balance</h3>
                    <h1 id="stats-total-clicks" style="font-size: 2.5rem; color: #0f172a; margin: 10px 0;">0</h1>
                    <p style="color: #10b981; font-size: 0.85rem; font-weight: 600;">▲ Operational State Active</p>
                </div>

                <!-- Card 2: Production Engine Ratios -->
                <div class="dashboard-card" style="max-width: 100%; text-align: left;">
                    <h3 style="color: #64748b; font-size: 0.85rem; text-transform: uppercase; letter-spacing: 0.5px;">Passive Factory Power</h3>
                    <h1 id="stats-auto-rate" style="font-size: 2.5rem; color: #0f172a; margin: 10px 0;">0/sec</h1>
                    <div style="background: #e2e8f0; width: 100%; height: 6px; border-radius: 3px; overflow: hidden; margin-top: 15px;">
                        <div id="stats-progress-bar" style="background: deepskyblue; width: 0%; height: 100%; transition: width 0.4s ease;"></div>
                    </div>
                </div>

                <!-- Card 3: Backend Runtime Frameworks -->
                <div class="dashboard-card" style="grid-column: span 2; max-width: 100%; text-align: left;">
                    <h3 style="color: #64748b; font-size: 0.85rem; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 15px;">Active Subsystems</h3>
                    <ul style="list-style: none; display: flex; flex-direction: column; gap: 10px;">
                        <li style="display: flex; justify-content: space-between; font-size: 0.95rem; color: #334155;">
                            <span>Active Profiler Username</span> <span id="stats-username" style="color: #6366f1; font-weight: 600;">Guest</span>
                        </li>
                        <li style="display: flex; justify-content: space-between; font-size: 0.95rem; color: #334155;">
                            <span>Runtime Engine</span> <span style="color: #10b981; font-weight: 600;">Cloudflare Serverless Static</span>
                        </li>
                    </ul>
                </div>

            </div>
        </main>

    </div>

    <script src="script.js"></script>
</body>
</html>
