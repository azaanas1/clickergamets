name: Local Windows Container Execution

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  local-windows-run:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Spin Up Local Windows LTSC Environment
        run: |
          docker run -d --name windows-vm \
            -p 127.0.0.1:8006:8006 \
            --device=/dev/kvm \
            --cap-add=NET_ADMIN \
            -e VERSION="11l" \
            -e RAM_SIZE="4G" \
            -e CPU_CORES="2" \
            dockurr/windows

      - name: Wait for Local Web Service Initialization
        run: |
          echo "Waiting for local port 8006 to respond..."
          until curl -s http://127.0.0.1:8006 > /dev/null; do
            sleep 10
          done
          echo "Local web server is responding!"

      - name: Expose Windows Desktop via Public Web URL
        run: |
          # Install Node.js standard package manager and localtunnel
          sudo apt-get update && sudo apt-get install -y nodejs npm
          sudo npm install -g localtunnel
          
          echo "--------------------------------------------------------"
          echo "CLICK THE LINK BELOW TO ACCESS THE WINDOWS DESKTOP:"
          echo "--------------------------------------------------------"
          
          # Launch localtunnel pointing straight to the local Windows port
          lt --port 8006
