name: Secure Interactive Debian Session

on:
  workflow_dispatch:

jobs:
  debian-ssh-session:
    runs-on: ubuntu-latest # Runs natively on the host to avoid socket blocks

    steps:
      - name: Initialize Debian Container
        run: |
          # Launches the Debian environment with host sharing so Upterm can bridge the SSH session
          docker run -d --name debian-cli --network host debian:bookworm-slim sleep infinity
          
          # Injects minimal networking requirements into the container
          docker exec debian-cli apt-get update
          docker exec debian-cli apt-get install -y openssh-client git curl

      - name: Establish Secure Outbound SSH Tunnel (Upterm)
        uses: lhotari/action-upterm@v1
        with:
          limit-access-to-actor: true
