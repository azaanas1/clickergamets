name: Local Windows Container Execution

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  local-windows-run:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Spin Up Local Windows LTSC Environment
        run: |
          docker run -d --name windows-vm \
            -p 127.0.0.1:8006:8006 \
            --device=/dev/kvm \
            --cap-add=NET_ADMIN \
            -e VERSION="11l" \
            -e RAM_SIZE="4G" \
            -e CPU_CORES="2" \
            dockurr/windows

      - name: Wait for Windows Boot Completion via Logs
        run: |
          echo "Monitoring internal Windows installation stream..."
          echo "This process takes 12-15 minutes to fully configure the OS environment."
          
          while ! docker logs windows-vm 2>&1 | grep -q "Windows started successfully"; do
            docker logs --tail 2 windows-vm
            sleep 20
          done
          
          echo "Success! The internal Windows boot sequence has finalized successfully."

      - name: Execute Local Integration Script
        run: |
          echo "Windows LTSC environment is accessible locally on the runner network."
          curl -vvv http://127.0.0.1:8006

      - name: Open Connection Tunnel
        uses: lhotari/action-upterm@v1
        with:
          limit-access-to-actor: true
