name: Secure Interactive Alpine Session

on:
  workflow_dispatch:

jobs:
  alpine-ssh-session:
    runs-on: ubuntu-latest
    container:
      image: alpine:3.20

    steps:
      - name: System Preparation and Dependency Injection
        run: |
          apk update --no-cache
          # Added curl explicitly so the upterm initialization script can fetch binaries
          apk add --no-cache openssh-client coreutils git bash curl

      - name: Establish Secure Outbound SSH Tunnel (Upterm)
        uses: lhotari/action-upterm@v1
        with:
          limit-access-to-actor: true
