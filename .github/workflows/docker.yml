name: Secure Interactive Debian Session

on:
  workflow_dispatch:

jobs:
  debian-ssh-session:
    runs-on: ubuntu-latest
    container:
      image: debian:bookworm-slim # Standard, lightweight production Debian image

    steps:
      - name: System Preparation and Core Tool Injection
        run: |
          apt-get update
          # Injects the missing dependencies required for secure tunneling handshakes
          apt-get install -y openssh-client git curl sudo

      - name: Establish Secure Outbound SSH Tunnel (Upterm)
        uses: lhotari/action-upterm@v1
        with:
          limit-access-to-actor: true
