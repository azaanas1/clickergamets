name: Local Windows Container Execution

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  local-windows-run:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Spin Up Local Windows LTSC Environment
        run: |
          # Binds port 8006 explicitly to the runner's local loopback interface (127.0.0.1)
          docker run -d --name windows-vm \
            -p 127.0.0.1:8006:8006 \
            --device=/dev/kvm \
            --cap-add=NET_ADMIN \
            -e VERSION="win11ltsc" \
            -e RAM_SIZE="4G" \
            -e CPU_CORES="2" \
            dockur/windows

      - name: Wait for Local System Boot Initialization
        run: |
          echo "Monitoring local container startup on 127.0.0.1..."
          # Standard loop to verify the container internal web server responds locally
          id=0
          until curl -s http://127.0.0.1:8006 > /dev/null || [ $id -eq 12 ]; do
            echo "Waiting for Windows environment initialization..."
            sleep 10
            id=$((id+1))
          done

      - name: Execute Local Integration Script
        run: |
          echo "Windows LTSC environment is accessible locally on the runner network."
          # You can add your curl, compilation, or automation scripts here
          curl -I http://127.0.0.1:8006
