name: Local Windows Container Execution

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  local-windows-run:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Spin Up Local Windows LTSC Environment
        run: |
          # Changed image to dockurr/windows (double 'r') to match Docker Hub registry
          docker run -d --name windows-vm \
            -p 127.0.0.1:8006:8006 \
            --device=/dev/kvm \
            --cap-add=NET_ADMIN \
            -e VERSION="win11ltsc" \
            -e RAM_SIZE="4G" \
            -e CPU_CORES="2" \
            dockurr/windows

      - name: Wait for Local System Boot Initialization
        run: |
          echo "We are waiting up to 2 minutes for the local web server port to mount..."
          id=0
          until curl -s http://127.0.0.1:8006 > /dev/null || [ $id -eq 12 ]; do
            echo "Waiting for Windows environment initialization..."
            sleep 10
            id=$((id+1))
          done

      - name: Execute Local Integration Script
        run: |
          echo "Windows LTSC environment is accessible locally on the runner network."
          curl -I http://127.0.0.1:8006
