name: Secure Interactive Alpine Session

on:
  workflow_dispatch: # Kept manual-only to prevent unauthorized pipeline execution

jobs:
  alpine-ssh-session:
    runs-on: ubuntu-latest
    container:
      image: alpine:3.20

    steps:
      - name: System Preparation and Dependency Injection
        run: |
          apk update --no-cache
          # Installs core dependencies needed for stable secure shell handling
          apk add --no-cache openssh-client bash curl openssh

      - name: Establish Secure Outbound SSH Tunnel
        # Uses the industry-standard, TOS-compliant Tmate action
        uses: mxschmitt/action-tmate@v3
        with:
          # Automatically terminates the tunnel after 15 minutes if left unattended
          timeout-minutes: 15
