name: Local Windows Container Execution

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  local-windows-run:
    runs-on: ubuntu-latest
    timeout-minutes: 60 # Extended slightly to give you plenty of interactive desktop testing time

    steps:
      - name: Spin Up Local Windows LTSC Environment
        run: |
          # Map port 3389 (RDP) on the host runner loopback network interface
          docker run -d --name windows-vm \
            -p 127.0.0.1:3389:3389 \
            --device=/dev/kvm \
            --cap-add=NET_ADMIN \
            -e VERSION="11l" \
            -e RAM_SIZE="4G" \
            -e CPU_CORES="2" \
            dockurr/windows

      - name: Wait for Windows Boot Completion via Logs
        run: |
          echo "Monitoring internal Windows installation stream..."
          while ! docker logs windows-vm 2>&1 | grep -q "Windows started successfully"; do
            docker logs --tail 2 windows-vm
            sleep 20
          done
          echo "Windows is fully up and running!"

      - name: Expose Windows RDP via Public Tunnel
        run: |
          sudo apt-get update && sudo apt-get install -y nodejs npm
          sudo npm install -g localtunnel
          
          echo "--------------------------------------------------------"
          echo "      CRITICAL REMOTE DESKTOP CONNECTION DATA:         "
          echo "--------------------------------------------------------"
          echo "   USERNAME: Docker"
          echo "   PASSWORD: (Leave blank / No password)"
          echo "--------------------------------------------------------"
          
          # Starts the tunnel pointing directly to the hardcoded RDP port layer
          lt --port 3389
