name: Secure Interactive Alpine Session

on:
  workflow_dispatch:

jobs:
  alpine-ssh-session:
    runs-on: ubuntu-latest
    container:
      image: alpine:3.20

    steps:
      - name: System Preparation and Dependency Injection
        run: |
          apk update --no-cache
          # Upterm requires openssh-client and coreutils to negotiate the secure handshake
          apk add --no-cache openssh-client coreutils git bash

      - name: Establish Secure Outbound SSH Tunnel (Upterm)
        uses: lhotari/action-upterm@v1
        with:
          ## Recommended: Limits access exclusively to your GitHub user profile
          limit-access-to-actor: true 
